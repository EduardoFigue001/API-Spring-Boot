# Configuración por defecto para PostgreSQL Local
server.port=8080

# Base de datos PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/ferremas
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=ferremas_user
spring.datasource.password=719397

# JPA/Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Configuración de Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

